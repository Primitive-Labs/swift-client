[models.Mix]
class_name = "Mix"
# omitted: field "title" (it differs from "Title" only in case, and a query table keeps one column per field name ignoring case); its values stay readable through documents.records()

[models.Mix.fields.id]
type = "id"
auto_assign = true

[models.Mix.fields.Title]
type = "string"

[models.Mix.fields.at]
type = "string"

[models.Mix.fields.mixed]
# observed: string, number, boolean (a value that does not fit string is converted when read)
type = "string"

[models.Mix.fields.n]
# observed: string, number (a value that does not fit string is converted when read)
type = "string"

[models.Mix.fields.nothing]
# observed: null only (exported as string)
type = "string"

[models.Mix.fields.tags]
type = "stringset"


[models.Shelf]
