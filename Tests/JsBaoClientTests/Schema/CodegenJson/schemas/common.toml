# The object defs the jsonshop type's JSON fields ref (#5899). Both tools read
# this directory: swift-bao-codegen for the models beside it, `primitive
# functions codegen --lang swift` for `Generated/JsonShared.generated.swift`,
# which declares each def's type, alias and binding.

# A closed struct with bounds, a pattern and an enum.
[defs.ShipAddress]
type = "object"
required = ["city"]
additionalProperties = false
[defs.ShipAddress.properties.city]
type = "string"
minLength = 1
maxLength = 40
[defs.ShipAddress.properties.zip]
type = "string"
pattern = "^[0-9]{4}(-[0-9]{3})?$"
[defs.ShipAddress.properties.floor]
type = "integer"
minimum = -5
maximum = 200
[defs.ShipAddress.properties.size]
type = "string"
enum = ["s", "m", "l"]

# A closed struct with a nested closed struct and an array, keys in the
# order the field table would give them.
[defs.ShipParcel]
type = "object"
properties.label.type = "string"
properties.box.type = "object"
properties.box.properties.width.type = "number"
properties.box.properties.count.type = "integer"
properties.box.required = ["width"]
properties.box.additionalProperties = false
properties.codes.type = "array"
properties.codes.items = { type = "integer" }
required = ["label"]
additionalProperties = false

# Two open objects with no declared properties, both `[String: JSONValue]`
# in Swift, with different schemas.
[defs.ShipMeta]
type = "object"

[defs.ShipNeedsKind]
type = "object"
required = ["kind"]

# A def no db3 field refs: it gets no alias and no binding.
[defs.ShipUnused]
type = "object"
[defs.ShipUnused.properties.note]
type = "string"
